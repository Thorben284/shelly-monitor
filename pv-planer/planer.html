<title>PV-Modulplaner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style id="pv-css">
/* Arbeitsoberfläche wie ein Fachprogramm: Kopfleiste · Flächentabelle | Plan (Luftbild, Werkzeuge) | Auswertung · Statusleiste */
:root{
  --bg:#e6eaee; --panel:#f6f8f9; --raised:#ffffff; --ink:#16202a; --muted:#5b6977; --faint:#8794a0; --line:#d0d8de; --line-strong:#b7c2cb;
  --accent:#c47400; --accent-ink:#1d1300; --accent-soft:#f8e7c6;
  --mod:#162b45; --mod-line:#8db2db; --obs:#df2f8f; --excl:#d23b3b;
  --ok:#2c7a4c; --ok-soft:#dcefe3; --warn:#a85512; --bad:#c23434; --bad-soft:#f7dede;
  --plan:#0e1317; --head:#1b2530; --head-ink:#e7edf2; --head-muted:#9fb0be; --head-line:#2c3946;
  --f-head:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1115; --panel:#131a20; --raised:#1a232b; --ink:#e2e8ed; --muted:#97a5b1; --faint:#6d7b87; --line:#25313b; --line-strong:#33424f;
  --accent:#f0a32a; --accent-ink:#1d1300; --accent-soft:#3b2a0e; --mod:#1c3352; --mod-line:#7fa6cf;
  --ok:#5cbd84; --ok-soft:#15301f; --warn:#e08a45; --bad:#ef6b6b; --bad-soft:#3a1717;
  --plan:#080b0e; --head:#0f151a; --head-ink:#e2e8ed; --head-muted:#8a9aa7; --head-line:#202b34; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1115; --panel:#131a20; --raised:#1a232b; --ink:#e2e8ed; --muted:#97a5b1; --faint:#6d7b87; --line:#25313b; --line-strong:#33424f;
  --accent:#f0a32a; --accent-ink:#1d1300; --accent-soft:#3b2a0e; --mod:#1c3352; --mod-line:#7fa6cf;
  --ok:#5cbd84; --ok-soft:#15301f; --warn:#e08a45; --bad:#ef6b6b; --bad-soft:#3a1717;
  --plan:#080b0e; --head:#0f151a; --head-ink:#e2e8ed; --head-muted:#8a9aa7; --head-line:#202b34; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;min-height:0}
/* Kopfleiste */
.bar{background:var(--head);color:var(--head-ink);border-bottom:1px solid var(--head-line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-head);font-weight:600;font-size:16px;letter-spacing:.02em;white-space:nowrap}
.brand svg{flex:none}
.proj{display:flex;flex-direction:column;min-width:0;flex:1 1 220px;border-left:1px solid var(--head-line);padding-left:18px}
.proj b{font-family:var(--f-head);font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj span{font-size:12px;color:var(--head-muted)}
.addr{display:flex;align-items:center;gap:8px;flex:2 1 460px;min-width:0}
.field{display:flex;align-items:center;background:var(--raised);color:var(--ink);border:1px solid var(--line-strong);border-radius:4px;height:34px;min-width:0}
.field input{border:0;background:transparent;height:100%;padding:0 10px;min-width:0;width:100%;outline:none}
.field label{font-size:12px;color:var(--muted);padding-right:10px;white-space:nowrap}
.field:focus-within{outline:2px solid var(--accent);outline-offset:0}
.f-addr{flex:1 1 260px}.f-kwp{flex:0 0 132px}.f-kwp input{text-align:right;padding-right:4px}
.btn{height:34px;padding:0 14px;border-radius:4px;border:1px solid var(--line-strong);background:var(--raised);color:var(--ink);cursor:pointer;white-space:nowrap;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.dark{background:transparent;color:var(--head-ink);border-color:var(--head-line)}
.btn.dark:hover{border-color:var(--head-muted)}
.btn.sm{height:28px;padding:0 10px;font-size:13px}
.newask{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--head-muted)}
.barmsg{flex-basis:100%;font-size:12.5px;color:#f3b4b4;margin-top:-4px}
.barmsg.okm{color:var(--head-muted)}

/* Arbeitsbereich */
.work{display:grid;grid-template-columns:minmax(300px,360px) minmax(0,1fr) minmax(260px,300px);min-height:0}
.side{background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0}
.side.l{border-right:1px solid var(--line)}.side.r{border-left:1px solid var(--line)}
.sec{padding:14px 16px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.scroll{overflow:auto;min-height:0;flex:1}
h2{font-family:var(--f-head);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 small{font-family:var(--f-body);text-transform:none;letter-spacing:0;font-weight:400;font-size:12px}

/* Flächentabelle */
.rows{display:flex;flex-direction:column}
.ar{border-bottom:1px solid var(--line);padding:9px 16px 9px 12px;display:grid;grid-template-columns:22px 34px minmax(0,1fr) auto;gap:4px 8px;align-items:center;cursor:pointer;border-left:3px solid transparent}
.ar:hover{background:var(--raised)}
.ar.on{border-left-color:var(--accent);background:var(--raised)}
.ar input{width:16px;height:16px;margin:0;accent-color:var(--accent)}
.tag{font-family:var(--f-num);font-size:12px;font-weight:500;background:var(--bg);border:1px solid var(--line);border-radius:3px;text-align:center;padding:1px 0}
.ar.on .tag{background:var(--accent-soft);border-color:var(--accent)}
.ar .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ar .meta{grid-column:3/5;display:flex;gap:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.ar .val{text-align:right;font-family:var(--f-num);font-size:13px;white-space:nowrap}
.ar .val small{display:block;color:var(--muted);font-size:11px}
.ar .more{grid-column:2/5;display:flex;flex-direction:column;gap:6px;margin-top:4px;cursor:default}
.ar .note{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:4px;overflow:hidden;align-self:flex-start;flex-wrap:wrap}
.seg button{border:0;border-right:1px solid var(--line-strong);background:var(--raised);padding:4px 9px;font-size:12px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.chip.w{color:var(--warn);border-color:currentColor;background:transparent}
.lfoot{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.msg{font-size:12.5px;color:var(--muted)}.msg.err{color:var(--bad)}

/* Plan */
.plan{position:relative;background:var(--plan);min-height:0;min-width:0;display:flex;flex-direction:column}
.tools{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.tgrp{display:inline-flex;border:1px solid var(--line-strong);border-radius:4px;overflow:hidden}
.tgrp button{border:0;border-right:1px solid var(--line-strong);background:var(--raised);height:30px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.tgrp button:last-child{border-right:0}
.tgrp button[aria-pressed="true"]{background:var(--accent-soft);font-weight:600}
.tgrp button svg{flex:none}
.tsp{flex:1}
.hint{font-size:12px;color:var(--muted)}
.canvas{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;cursor:grab}
.canvas.drag{cursor:grabbing}
#map svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.canvas .cand{cursor:pointer}
.canvas.mt .cand{cursor:inherit}
.canvas.mt .mod{cursor:pointer}
.canvas .mod:hover{stroke:var(--accent);stroke-width:2.5}
#map svg *{vector-effect:non-scaling-stroke}
.canvas .lbl{font-family:var(--f-num);font-weight:500;font-size:calc(var(--k,1)*13px);fill:#fff;stroke:#000;stroke-width:3px;paint-order:stroke;pointer-events:none}
.north{position:absolute;top:12px;right:12px;width:30px;height:38px;pointer-events:none}
.scale{background:var(--raised);border:1px solid var(--line);border-radius:4px;padding:5px 8px;font:500 11.5px var(--f-num);color:var(--ink);display:flex;flex-direction:column;gap:3px;opacity:.94}
.scale i{display:block;height:5px;border:1.5px solid var(--ink);border-top:0}
.ovl{position:absolute;left:12px;bottom:12px;display:flex;gap:10px;align-items:flex-end;pointer-events:none}
.legend{background:var(--raised);border:1px solid var(--line);border-radius:4px;padding:6px 10px;display:flex;gap:12px;font-size:11.5px;color:var(--muted);flex-wrap:wrap;max-width:min(560px,calc(100% - 24px));opacity:.94}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px;border-radius:1px}
.empty{position:absolute;inset:0;display:grid;place-items:center;padding:24px}
.empty .card{background:var(--raised);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:22px 24px;max-width:520px;width:100%;display:flex;flex-direction:column;gap:12px}
.empty h3{font-family:var(--f-head);font-weight:600;font-size:20px;margin:0}
.empty p{margin:0;color:var(--muted)}

/* Fortschritt */
.prog{display:flex;flex-direction:column;gap:8px}
.prog .top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.prog .pct{font-family:var(--f-num);font-size:22px;font-weight:500}
.meter{height:8px;border-radius:2px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.meter>i{display:block;height:100%;background:var(--accent);transition:width .6s ease}
.prog ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.prog li::before{content:"○";display:inline-block;width:18px;color:var(--faint)}
.prog li.done{color:var(--ok)}.prog li.done::before{content:"✓";color:var(--ok)}
.prog li.now{color:var(--ink);font-weight:600}.prog li.now::before{content:"●";color:var(--accent)}
@media (prefers-reduced-motion:reduce){.meter>i{transition:none}}

/* Auswertung */
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.kpi div{background:var(--raised);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.kpi .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.kpi .v{font-family:var(--f-num);font-size:20px;font-weight:500;line-height:1.2}
.kpi .v small{font-family:var(--f-body);font-size:12px;color:var(--muted);margin-left:3px}
.cap{margin-top:12px;display:flex;flex-direction:column;gap:5px}
.cap .row{display:flex;justify-content:space-between;font-size:12.5px}
.cap .meter.over>i{background:var(--bad)}
.cap.over .row b{color:var(--bad)}
.dist{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.dist .dr{display:grid;grid-template-columns:34px 1fr 64px;gap:8px;align-items:center}
.dist .db{height:6px;background:var(--bg);border-radius:1px;overflow:hidden}.dist .db i{display:block;height:100%;background:var(--mod-line)}
.dist .dr span:last-child{text-align:right}
.notes{margin:0;padding-left:16px;color:var(--muted);font-size:12.5px;display:flex;flex-direction:column;gap:6px}
.copyline{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.copyline code{font-family:var(--f-num);font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:4px 6px;user-select:all;word-break:break-all;flex:1;min-width:0}

/* Statusleiste */
.status{background:var(--panel);border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px;display:flex;align-items:center;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;min-height:32px}
.steps{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.st{display:inline-flex;align-items:center;gap:5px}
.st b{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;font-size:10px;background:var(--line);color:var(--ink);font-weight:600}
.st.done b{background:var(--ok);color:var(--raised)}.st.now{color:var(--ink);font-weight:600}.st.now b{background:var(--accent);color:var(--accent-ink)}
.st+.st::before{content:"";width:14px;height:1px;background:var(--line-strong);margin-right:6px}
.sbar{flex:1;display:flex;align-items:center;gap:8px;min-width:200px}
.sbar .meter{flex:0 1 180px;height:6px}
.sstate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--ok);flex:none}
.dot.busy{background:var(--accent)}

@media (max-width:1180px){.work{grid-template-columns:minmax(280px,330px) minmax(0,1fr)}.side.r{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.app{height:auto;min-height:100%}.plan{min-height:560px}}
@media (max-width:760px){.addr{flex-wrap:wrap}.f-addr{flex:1 1 100%}.proj b{white-space:normal}.legend{display:none}.hint{display:none}.work{grid-template-columns:minmax(0,1fr)}.side.l{border-right:0}.plan{min-height:440px;order:-1}.proj{border-left:0;padding-left:0}.f-kwp{flex:1 1 120px}}
</style>
<div id="app"></div>
<script type="application/json" id="pv-data">/*__DATA__*/null</script>
<script id="pv-app">
(function(){
const D=JSON.parse(document.getElementById("pv-data").textContent),$=id=>document.getElementById(id);
const fmt=(x,d=0)=>Number.isFinite(x)?x.toLocaleString("de-DE",{minimumFractionDigits:d,maximumFractionDigits:d}):"–";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const pts=P=>P.map(p=>p.join(",")).join(" ");
const inP=(x,y,P)=>{let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const[a,b]=P[i],[e,f]=P[j];if((b>y)!==(f>y)&&x<(e-a)*(y-b)/(f-b)+a)c=!c}return c};
const dSeg=(x,y,[a,b],[e,f])=>{const dx=e-a,dy=f-b,L=dx*dx+dy*dy,t=L?Math.max(0,Math.min(1,((x-a)*dx+(y-b)*dy)/L)):0;return Math.hypot(x-a-t*dx,y-b-t*dy)};
/* Beschriftungspunkt: Punkt im Umriss mit größtem Randabstand */
const cen=P=>{const xs=P.map(p=>p[0]),ys=P.map(p=>p[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);let best=[(x0+x1)/2,(y0+y1)/2],bd=-1;
  for(let i=1;i<24;i++)for(let j=1;j<24;j++){const x=x0+(x1-x0)*i/24,y=y0+(y1-y0)*j/24;if(!inP(x,y,P))continue;const d=Math.min(...P.map((p,k)=>dSeg(x,y,p,P[(k+1)%P.length])));if(d>bd){bd=d;best=[x,y]}}return best};
const DIRS=["N","NO","O","SO","S","SW","W","NW"];
const azOf=asp=>((asp+180)%360+360)%360, compass=az=>DIRS[Math.round(az/45)%8];
const sel=()=>D.areas.filter(a=>a.selected);
const cnt=v=>v.mods.length-(v.off||[]).length;                 // aktive Module (v.off = entfernte Plätze)
const pending=()=>!!D.request&&(!D.processed||D.processed.at<D.request.at);
const changed=()=>sel().some(a=>!a.analysed);                   // gewählte Flächen ohne Berechnung
let fresh=false,dirty=false,tool="area",showObs=true,showLbl=true;

/* Fortschritt: echte Schritte meldet Claude über D.progress {step, at}; dazwischen Schätzung nach üblicher Dauer */
const PHASES={adresse:{min:15,steps:["Adresse und Kataster","3D-Modell, Luftbild, Street View","Hindernisse und Erträge","Belegung und Gegenprüfung","Planer aufbauen"]},
  auswahl:{min:10,steps:["Hindernisse erkennen","Ertragsdaten (PVGIS)","Module auslegen","Gegenprüfung"]}};
function progress(req){
  const P=PHASES[req.type],el=(Date.now()-new Date(req.at).getTime())/6e4,n=P.steps.length;
  const g=D.progress&&D.progress.type===req.type&&D.progress.at>=req.at?D.progress:null,done=g?Math.min(g.step-1,n):0;
  const pct=Math.round(100*Math.max(done/n,Math.min(Math.min(el/P.min,.95),(done+1)/n-.02)));
  return {P,el,done,pct,over:el>P.min*1.5,rest:Math.max(0,Math.round(P.min*(1-pct/100)))};
}
const when=t=>new Date(t).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
function progHTML(req){const g=progress(req);
  return `<div class="prog" role="status" aria-live="polite"><div class="top"><span>${req.type==="adresse"?`Analyse „${esc(req.address)}“${req.kwp?` · max. ${fmt(req.kwp)} kWp`:""}`:`Nachberechnung ${esc(req.ids.join(", "))}`}<br><small class="msg">seit ${when(req.at)} · ${g.over?"dauert länger als üblich":g.rest>0?`noch ca. ${g.rest} Min. (Schätzung)`:"gleich fertig"}</small></span><span class="pct">${g.pct} %</span></div>
    <div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${g.pct}" aria-label="Fortschritt"><i style="width:${g.pct}%"></i></div>
    <ol>${g.P.steps.map((t,k)=>`<li class="${k<g.done?"done":k===g.done?"now":""}">${t}</li>`).join("")}</ol>
    ${g.el>5&&g.done===0?`<p class="msg err">Noch keine Rückmeldung: bitte im Chat „gesendet“ schreiben.</p>`:""}</div>`}

const ICON={sel:'<svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2l9 5-4 1.2L6.5 13z" fill="currentColor"/></svg>',
  mod:'<svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12v10H2z M6 3v10 M10 3v10 M2 8h12" stroke="currentColor" fill="none" stroke-width="1.3"/></svg>'};
$("app").innerHTML=`<div class="app">
<header class="bar">
  <div class="brand"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M2 15l9-11 9 11z" fill="none" stroke="var(--accent)" stroke-width="1.6"/><path d="M6.5 15l4.5-5.5 4.5 5.5" fill="none" stroke="var(--accent)" stroke-width="1.2"/><path d="M2 18h18" stroke="var(--head-muted)" stroke-width="1.4"/></svg>PV-Modulplaner</div>
  <div class="proj"><b id="ptitle"></b><span id="pmeta"></span></div>
  <form class="addr" id="addrForm" autocomplete="off">
    <div class="field f-addr"><input id="addr" type="text" placeholder="Straße Hausnummer, PLZ Ort" aria-label="Adresse"></div>
    <div class="field f-kwp"><input id="kwp" type="number" min="1" max="10000" step="1" inputmode="numeric" placeholder="100" aria-label="Maximale Anlagenleistung in kWp"><label for="kwp">kWp max.</label></div>
    <button class="btn pri" id="plan" type="submit">Planen</button>
  </form>
  <button class="btn dark" id="newBtn" type="button">Neue Planung</button>
  <span class="newask" id="newAsk" hidden>Planung verwerfen? <button class="btn dark sm" id="newYes" type="button">Ja</button><button class="btn dark sm" id="newNo" type="button">Nein</button></span>
  <div class="barmsg" id="addrMsg" hidden></div>
</header>
<main class="work">
  <aside class="side l" aria-label="Dachflächen">
    <div class="sec" style="padding-bottom:8px"><h2>Dachflächen <small id="areaSum"></small></h2></div>

      <div class="tgrp" role="group" aria-label="Zoom"><button type="button" id="zOut" aria-label="Verkleinern">−</button><button type="button" id="zFit">Einpassen</button><button type="button" id="zIn" aria-label="Vergrößern">+</button></div>

    <div class="canvas" id="canvas"><div id="map"></div>
      <svg class="north" id="north" viewBox="0 0 30 38" aria-label="Norden oben"><path d="M15 2l8 20-8-5-8 5z" fill="var(--raised)" stroke="var(--ink)" stroke-width="1.2"/><text x="15" y="35" text-anchor="middle" font-family="IBM Plex Sans,sans-serif" font-size="11" font-weight="600" fill="var(--raised)" stroke="var(--ink)" stroke-width="2.5" paint-order="stroke">N</text></svg>
      <div class="ovl" id="ovl"><div class="scale" id="scale"><span id="scaleTxt">5 m</span><i id="scaleBar"></i></div><div class="legend"><span><i style="border:2px solid var(--accent)"></i>gewählt</span><span><i style="border:1.5px dashed var(--faint)"></i>möglich</span><span><i style="background:var(--mod);outline:1px solid var(--mod-line)"></i>Modul</span><span><i style="border:1.5px dashed var(--muted)"></i>Platz frei</span><span><i style="background:var(--obs)"></i>Hindernis + Abstand</span></div></div>

$("addr").value=D.request&&D.request.type==="adresse"&&pending()?D.request.address:(D.address||"");
$("kwp").value=D.target||(D.request&&D.request.kwp)||"";

/* Ansichtsfenster des Plans (Bildkoordinaten); Mausrad zoomt um den Zeiger, Ziehen verschiebt */
let vb=null;
const fit=()=>{const I=D.image;if(!I)return;const el=$("canvas"),r=el.clientWidth/Math.max(1,el.clientHeight);let w=I.w,h=I.h;if(w/h<r)w=h*r;else h=w/r;vb={x:(I.w-w)/2,y:(I.h-h)/2,w,h}};
/* Ansicht anwenden; Beschriftung und Maßstab in Bildschirmgröße halten */
const applyVb=()=>{const s=$("map").querySelector("svg");if(!s||!vb)return;s.setAttribute("viewBox",`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const k=vb.w/Math.max(1,$("canvas").clientWidth);s.style.setProperty("--k",k);
  const mPerPx=D.image.mpp*k,target=90*mPerPx,steps=[1,2,5,10,20,50,100],m=steps.find(x=>x>=target)||100;$("scaleBar").style.width=m/mPerPx+"px";$("scaleTxt").textContent=m+" m"};
const zoom=(f,cx,cy)=>{if(!vb)return;const I=D.image,nw=Math.min(Math.max(vb.w*f,I.w*.08),I.w*3),k=nw/vb.w;cx=cx??vb.x+vb.w/2;cy=cy??vb.y+vb.h/2;vb={x:cx-(cx-vb.x)*k,y:cy-(cy-vb.y)*k,w:nw,h:vb.h*k};applyVb()};
const toImg=e=>{const r=$("canvas").getBoundingClientRect();return [vb.x+(e.clientX-r.left)/r.width*vb.w,vb.y+(e.clientY-r.top)/r.height*vb.h]};

function mapSVG(an){
  const I=D.image;
  let o=`<svg viewBox="0 0 ${I.w} ${I.h}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Luftbild mit Dachflächen und Modulbelegung"><image href="${I.src}" width="${I.w}" height="${I.h}"/>`;
  if(an.length)D.excluded.forEach(e=>{o+=`<polygon points="${pts(e.poly)}" fill="rgba(255,59,59,.3)" stroke="var(--excl)" stroke-width="2"><title>${esc(e.name)}: nicht nutzbar</title></polygon>`});
  D.areas.forEach((a,i)=>{const on=a.selected,v=a.analysed&&on?a.variants[a.mounting]:null;
    o+=`<g class="cand" data-i="${i}" tabindex="0" role="checkbox" aria-checked="${on}" aria-label="${esc(a.id+" "+a.name)}"><polygon class="edge" points="${pts(a.outline)}" fill="${on?"rgba(240,163,42,.10)":"rgba(0,0,0,.22)"}" stroke="${on?"var(--accent)":"#fff"}" stroke-width="${on?2.2:1.3}" ${on?"":'stroke-dasharray="7 5"'}/>`;
    if(v){const off=new Set(v.off||[]);v.mods.forEach((m,j)=>{o+=off.has(j)?`<polygon class="mod off" data-i="${i}" data-j="${j}" points="${pts(m)}" fill="rgba(255,255,255,.06)" stroke="#fff" stroke-width="1" stroke-dasharray="3 2"><title>Platz frei — anklicken zum Hinzufügen</title></polygon>`:`<polygon class="mod" data-i="${i}" data-j="${j}" points="${pts(m)}" fill="var(--mod)" stroke="var(--mod-line)" stroke-width=".7"><title>Modul — anklicken zum Entfernen</title></polygon>`});
      if(showObs)a.obstacles.forEach(q=>{o+=`<polygon points="${pts(q.zone)}" fill="rgba(223,47,143,.16)" stroke="var(--obs)" stroke-width="1" stroke-dasharray="3 2" pointer-events="none"/><polygon points="${pts(q.poly)}" fill="var(--obs)" pointer-events="none"><title>${esc(q.label)}</title></polygon>`})}
    if(showLbl){const c=cen(a.outline);o+=`<text class="lbl" x="${c[0]}" y="${c[1]}" text-anchor="middle" dominant-baseline="middle">${a.id}${v?" · "+cnt(v):""}</text>`}
    o+=`</g>`});
  o+=`</svg>`;
  return o;
}

function render(){
  const s=fresh?[]:sel(),an=s.filter(a=>a.analysed),req=fresh?null:D.request,pend=!fresh&&pending(),has=!fresh&&!!D.image;
  const stage=!has?0:pend&&req.type==="auswahl"?2:an.length&&!changed()?3:1;
  $("ptitle").textContent=fresh?"Neue Planung":D.title||D.address||"Neue Planung";
  $("pmeta").textContent=fresh||!D.image?"Adresse und maximale Leistung eingeben":`Stand ${D.created?new Date(D.created).toLocaleDateString("de-DE"):"–"} · ${D.areas.length} Dachflächen · Modul ${D.module.wp} Wp, ${fmt(D.module.l*1000)} × ${fmt(D.module.b*1000)} mm, hochkant`;
  $("newBtn").hidden=!D.image||fresh||!$("newAsk").hidden;
  $("plan").disabled=pend&&req.type==="adresse";
  // Kennzahlen
  let n=0,kwp=0,kwh=0;const per=[];an.forEach(a=>{const v=a.variants[a.mounting],c=cnt(v),k=c*D.module.wp/1000;n+=c;kwp+=k;kwh+=k*v.spec;per.push([a.id,k])});
  $("kpi").innerHTML=`<div><span class="k">Leistung</span><span class="v">${fmt(kwp,1)}<small>kWp</small></span></div><div><span class="k">Module</span><span class="v">${fmt(n)}<small>Stk.</small></span></div><div><span class="k">Ertrag</span><span class="v">${fmt(kwh/1000,1)}<small>MWh/a</small></span></div><div><span class="k">Modulfläche</span><span class="v">${fmt(n*D.module.l*D.module.b)}<small>m²</small></span></div>`;
  const T=fresh?null:D.target,over=T&&kwp>T+1e-6;
  $("cap").className="cap"+(over?" over":"");
  $("cap").innerHTML=T?`<div class="row"><span>Obergrenze</span><b class="num">${fmt(kwp,1)} / ${fmt(T)} kWp</b></div><div class="meter${over?" over":""}"><i style="width:${Math.min(100,kwp/T*100)}%"></i></div><div class="msg${over?" err":""}">${over?`${fmt(kwp-T,1)} kWp über der Grenze. Flächen oder Module abwählen.`:`Noch ${fmt(T-kwp,1)} kWp frei (${fmt(Math.floor((T-kwp)*1000/D.module.wp))} Module).`}</div>`:"";
  const mx=Math.max(1,...per.map(p=>p[1]));
  $("dist").innerHTML=per.length?per.sort((a,b)=>b[1]-a[1]).map(([id,k])=>`<div class="dr"><span class="tag">${id}</span><span class="db"><i style="width:${k/mx*100}%"></i></span><span class="num">${fmt(k,1)}</span></div>`).join(""):`<span class="msg">Noch keine Fläche gewählt.</span>`;
  // Flächentabelle
  const tot=D.areas.filter(a=>a.analysed).reduce((t,a)=>t+Math.max(0,...Object.values(a.variants).map(v=>v.mods.length)),0);
  $("areaSum").textContent=D.areas.length&&!fresh?`${s.length} von ${D.areas.length} gewählt · max. ${fmt(tot)} Module`:"";
  $("list").innerHTML=fresh||!has?`<div class="sec msg">Nach der Analyse erscheinen hier alle Dachflächen mit Ausrichtung, Neigung und möglicher Modulzahl.</div>`:D.areas.map((a,i)=>{
    const ks=Object.keys(a.variants||{}),v=a.analysed&&a.mounting?a.variants[a.mounting]:null,on=a.selected,c=v?cnt(v):0,az=v?azOf(v.aspects[0]):null;
    return `<div class="ar${on?" on":""}" data-i="${i}"><input type="checkbox" data-i="${i}" ${on?"checked":""} aria-label="${esc(a.id+" "+a.name)} auswählen"><span class="tag">${a.id}</span><span class="nm">${esc(a.name)}</span>
      <span class="val">${v?(on?`${fmt(c)} Mod.<small>${fmt(c*D.module.wp/1000,1)} kWp</small>`:`<span style="color:var(--muted)">${fmt(Math.max(...ks.map(k=>a.variants[k].mods.length)))} mögl.</span>`):`<span class="chip w">offen</span>`}</span>
      <span class="meta">${v?`<span>${compass(az)} ${fmt(az)}°</span><span>${fmt(v.tilt)}° Neigung</span><span>${fmt(v.spec)} kWh/kWp</span>`:`<span>${esc(a.kind)}</span>`}<span>${fmt(a.area)} m²</span>${v&&on&&(v.off||[]).length?`<span>${v.off.length} Plätze frei</span>`:""}</span>
      ${on?`<div class="more">${ks.length>1?`<div class="seg" data-i="${i}" role="group" aria-label="Montage">${ks.map(k=>`<button type="button" data-k="${k}" aria-pressed="${k===a.mounting}">${esc(a.variants[k].label)} · ${cnt(a.variants[k])}</button>`).join("")}</div>`:""}
        ${a.note?`<span class="note">${esc(a.note)}</span>`:""}${a.obstacles&&a.obstacles.length&&v?`<span class="note">${a.obstacles.length} Hindernisse berücksichtigt</span>`:""}</div>`:""}</div>`}).join("");
  $("save").hidden=!dirty;$("send").hidden=!changed()||pend;
  // Plan
  $("tools").hidden=!has;$("ovl").hidden=!has;$("north").toggleAttribute("hidden",!has);
  if(has){if(!vb)fit();$("map").innerHTML=mapSVG(an);applyVb()}else $("map").innerHTML="";
  $("canvas").classList.toggle("mt",tool==="mod");
  $("thint").textContent=tool==="mod"?"Modul anklicken: entfernen · freien Platz anklicken: hinzufügen":"Fläche anklicken: an- oder abwählen · Ziehen: verschieben · Mausrad: zoomen";
  $("empty").hidden=has&&!(pend&&req.type==="adresse");
  $("emptyCard").innerHTML=pend&&req.type==="adresse"?`<h3>Analyse läuft</h3>${progHTML(req)}`:`<h3>Neue PV-Planung</h3><p>Adresse und maximale Anlagenleistung oben eintragen und „Planen“ drücken. Claude ermittelt Gebäudeumriss (Liegenschaftskataster), Dachflächen (Luftbild, Street View, 3D-Gebäudemodell), Hindernisse und Erträge und legt alle Flächen mit hochkant gestellten Modulen aus.</p><p>Danach Flächen anklicken: Die Belegung erscheint sofort und lässt sich modulweise anpassen.</p>`;
  // Statusleiste
  const ST=[["Adresse",0],["Flächen wählen",1],["Hindernisse",2],["Belegung",3]];
  const g=pend?progress(req):null;
  $("status").innerHTML=`<div class="steps">${ST.map(([t,k])=>`<span class="st ${stage===k?"now":stage>k?"done":""}"><b>${stage>k?"✓":k+1}</b>${t}</span>`).join("")}</div>
    <div class="sbar">${g?`<span class="dot busy"></span><span class="meter"><i style="width:${g.pct}%"></i></span><span class="num">${g.pct} %</span><span class="sstate">${esc(g.P.steps[Math.min(g.done,g.P.steps.length-1)])} · noch ca. ${g.rest} Min.</span>`:`<span class="dot"></span><span class="sstate">${D.status&&!fresh?esc(D.status):has?"Bereit":"Keine Planung geladen"}</span>`}</div>
    <span>${D.image&&!fresh?`Luftbild ${esc(D.image.source||"")} · ${fmt(D.image.mpp*100,1)} cm/px`:""}</span>`;
  $("notes").innerHTML=(fresh?[]:D.notes).map(t=>`<li>${t}</li>`).join("")||`<li>Noch keine Hinweise.</li>`;
  $("copyLine").textContent=has?`PV-Auswahl ${D.address}: ${s.map(a=>a.id).join(", ")||"keine"}`:`PV-Planer Adresse: ${$("addr").value.trim()||"…"}${$("kwp").value?`, max. ${$("kwp").value} kWp`:""}`;
}

/* Bedienung im Plan: Klick wählt, Ziehen verschiebt */
const cv=$("canvas");let down=null,moved=false;
cv.addEventListener("pointerdown",e=>{if(!vb||e.button!==0)return;down={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y};moved=false});
cv.addEventListener("pointermove",e=>{if(!down)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;if(!moved&&Math.hypot(dx,dy)<5)return;
  if(!moved){moved=true;cv.classList.add("drag")}const r=cv.getBoundingClientRect();vb.x=down.vx-dx/r.width*vb.w;vb.y=down.vy-dy/r.height*vb.h;applyVb()});
const up=()=>{down=null;cv.classList.remove("drag")};window.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
cv.addEventListener("wheel",e=>{if(!vb)return;e.preventDefault();const [x,y]=toImg(e);zoom(e.deltaY>0?1.15:1/1.15,x,y)},{passive:false});
cv.addEventListener("click",e=>{if(moved){moved=false;return}
  if(tool==="mod"){const m=e.target.closest(".mod");if(!m)return;const a=D.areas[+m.dataset.i],v=a.variants[a.mounting],j=+m.dataset.j,off=new Set(v.off||[]);off.has(j)?off.delete(j):off.add(j);v.off=[...off].sort((x,y)=>x-y);dirty=true;render();return}
  const g=e.target.closest(".cand");if(g){D.areas[+g.dataset.i].selected=!D.areas[+g.dataset.i].selected;render()}});
cv.addEventListener("keydown",e=>{const g=e.target.closest(".cand");if(g&&(e.key==="Enter"||e.key===" ")){e.preventDefault();D.areas[+g.dataset.i].selected=!D.areas[+g.dataset.i].selected;render();const n=document.querySelector(`.cand[data-i="${g.dataset.i}"]`);n&&n.focus()}});
const setTool=t=>{tool=t;$("tArea").setAttribute("aria-pressed",t==="area");$("tMod").setAttribute("aria-pressed",t==="mod");render()};
$("tArea").onclick=()=>setTool("area");$("tMod").onclick=()=>setTool("mod");
$("zIn").onclick=()=>zoom(1/1.4);$("zOut").onclick=()=>zoom(1.4);$("zFit").onclick=()=>{fit();applyVb()};
$("lObs").onclick=()=>{showObs=!showObs;$("lObs").setAttribute("aria-pressed",showObs);render()};
$("lLbl").onclick=()=>{showLbl=!showLbl;$("lLbl").setAttribute("aria-pressed",showLbl);render()};
window.addEventListener("resize",()=>{if(!vb||!D.image)return;const r=cv.clientWidth/Math.max(1,cv.clientHeight),cx=vb.x+vb.w/2,cy=vb.y+vb.h/2;vb.h=vb.w/r;vb.y=cy-vb.h/2;vb.x=cx-vb.w/2;applyVb()});

/* Flächentabelle */
$("list").addEventListener("click",e=>{const b=e.target.closest(".seg button");if(b){D.areas[+b.closest(".seg").dataset.i].mounting=b.dataset.k;render();return}
  if(e.target.closest(".more")||e.target.matches("input"))return;const r=e.target.closest(".ar");if(r){D.areas[+r.dataset.i].selected=!D.areas[+r.dataset.i].selected;render()}});
$("list").addEventListener("change",e=>{const i=e.target.dataset.i;if(i!=null){D.areas[+i].selected=e.target.checked;render()}});

/* Kopieren */
const copy=async(t,msg)=>{try{await navigator.clipboard.writeText(t);msg.textContent="Kopiert."}catch(_){msg.textContent="Kopieren nicht möglich. Text markieren und mit Strg+C kopieren."}};
$("copyBtn").onclick=()=>copy($("copyLine").textContent,$("copyMsg"));
$("copySum").onclick=()=>{let n=0,k=0,e=0;const L=sel().filter(a=>a.analysed).map(a=>{const v=a.variants[a.mounting],c=cnt(v),kw=c*D.module.wp/1000,az=azOf(v.aspects[0]);n+=c;k+=kw;e+=kw*v.spec;return `${a.id} ${a.name}: ${c} Module, ${fmt(kw,1)} kWp (${v.label}, ${compass(az)} ${fmt(az)}°, ${fmt(v.spec)} kWh/kWp)`});
  copy([`PV-Planung ${D.title||D.address}`,`Modul ${D.module.wp} Wp, hochkant`,...L,`Summe: ${n} Module, ${fmt(k,1)} kWp${D.target?` (max. ${fmt(D.target)} kWp)`:""}, ca. ${fmt(e/1000,1)} MWh/a`].join("\n"),$("copyMsg"))};
const upd=()=>{if(!D.image||fresh)$("copyLine").textContent=`PV-Planer Adresse: ${$("addr").value.trim()||"…"}${$("kwp").value?`, max. ${$("kwp").value} kWp`:""}`};
$("addr").addEventListener("input",upd);$("kwp").addEventListener("input",upd);

/* Senden und Speichern: die Seite veröffentlicht sich selbst; Claude liest die Anfrage und aktualisiert die Seite */
const RESET=":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}";
function pageSource(data){
  const head=[...document.querySelectorAll("title,meta[name='claude:viewport-fit-sides'],link[rel=preconnect],link[rel=stylesheet]")].map(n=>n.outerHTML).join("");
  return "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>"+RESET+"</style></head><body>"+head+
    `<style id="pv-css">${$("pv-css").textContent}</style><div id="app"></div><script type="application/json" id="pv-data">${JSON.stringify(data).replace(/</g,"\\u003c")}<\/script><script id="pv-app">${$("pv-app").textContent}<\/script></body></html>`;
}
const say=(el,t,err)=>{el.hidden=!t;el.className=el.id==="addrMsg"?"barmsg"+(err?"":" okm"):"msg"+(err?" err":"");el.textContent=t};
async function submit(request,msgEl,btn){
  btn.disabled=true;say(msgEl,"Wird gesendet …");
  const art=window.claude?await window.claude.use("artifact"):null;
  if(!art){say(msgEl,"Senden geht in dieser Ansicht nicht. Zeile unter „Hinweise und Quellen → Falls Senden nicht funktioniert“ in den Chat kopieren.",1);btn.disabled=false;return}
  const data=JSON.parse(JSON.stringify(D));data.request=Object.assign(request,{at:new Date().toISOString()});data.status=null;data.progress=null;
  if(request.type==="adresse")Object.assign(data,{address:request.address,title:request.address,image:null,areas:[],excluded:[],notes:[],processed:null,geo:null,target:request.kwp||null});
  try{await art.publish(pageSource(data));say(msgEl,"Gesendet. Die Seite lädt neu.")}
  catch(e){const c=e&&e.code;btn.disabled=false;say(msgEl,c==="conflict"?"Die Seite wurde gerade aktualisiert. Nach dem Neuladen bitte erneut senden.":c==="not_writer"||c==="not_granted"?"Nur Lesezugriff: Zeile unter „Falls Senden nicht funktioniert“ in den Chat kopieren.":"Senden fehlgeschlagen. Zeile unter „Falls Senden nicht funktioniert“ in den Chat kopieren.",1)}
}
$("addrForm").addEventListener("submit",e=>{e.preventDefault();const a=$("addr").value.trim(),k=+$("kwp").value;
  if(a.length<5){say($("addrMsg"),"Bitte Straße, Hausnummer und Ort eingeben.",1);$("addr").focus();return}
  if(!(k>0)){say($("addrMsg"),"Bitte die maximale Anlagenleistung in kWp angeben.",1);$("kwp").focus();return}
  submit({type:"adresse",address:a,kwp:k},$("addrMsg"),$("plan"))});
$("newBtn").onclick=()=>{$("newAsk").hidden=false;$("newBtn").hidden=true;$("newYes").focus()};
$("newNo").onclick=()=>{$("newAsk").hidden=true;render()};
$("newYes").onclick=()=>{fresh=true;vb=null;$("newAsk").hidden=true;$("addr").value="";$("kwp").value="";say($("addrMsg"),"");render();$("addr").focus()};
$("send").onclick=()=>{const ids=sel().map(a=>a.id);if(ids.length)submit({type:"auswahl",ids},$("sendMsg"),$("send"))};
$("save").onclick=async()=>{const b=$("save"),m=$("sendMsg");b.disabled=true;say(m,"Wird gespeichert …");
  const art=window.claude?await window.claude.use("artifact"):null;
  if(!art){say(m,"Speichern geht in dieser Ansicht nicht.",1);b.disabled=false;return}
  try{await art.publish(pageSource(JSON.parse(JSON.stringify(D))));dirty=false;b.disabled=false;say(m,"Gespeichert.");render()}
  catch(e){b.disabled=false;say(m,e&&e.code==="conflict"?"Die Seite wurde inzwischen geändert. Bitte neu laden und erneut ändern.":"Speichern fehlgeschlagen.",1)}};
render();
setInterval(()=>{if(!fresh&&pending())render()},15000);   // Fortschritt laufend nachführen
})();
